# The development and from-source file: builds the image from this checkout.
#
# To run the published image instead, without a clone, use deploy/compose.yaml:
#   curl -O https://raw.githubusercontent.com/Reyzartz/breckr/master/deploy/compose.yaml
#
# SECURITY: an open CDP port is remote code execution -- anyone who can reach it
# can drive a browser, read local files through it and pivot into this host. The
# browser's port below is published to 127.0.0.1 only, and must stay that way.
# Do not "fix" a connection problem by widening it to 0.0.0.0.
#
# The app's own port defaults to 127.0.0.1 too. Widening that one is a real
# option -- but set AUTH_PASSWORD first, or you have published an unauthenticated
# task runner. See BIND_ADDRESS in .env.example.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Without this, the build picks the last stage -- which is `standalone`,
      # with a whole Chromium in it. Compose has lightpanda next door and wants
      # the slim one.
      target: runtime
    # Tags what `build` produces, and is what makes `docker compose pull`
    # meaningful. Note that a local build shadows a pulled image under this same
    # tag until you pull again.
    image: reyzartz/breckr:latest
    container_name: web-task-monitor
    restart: unless-stopped
    depends_on:
      - lightpanda
    env_file:
      # Optional, so this file runs in a fresh clone with nothing configured.
      # Compose still reads ./.env for the ${...} interpolation below either way.
      - path: .env
        required: false
    environment:
      # Overrides for the values in .env that mean something different (or
      # nothing) inside a container: the browser is reached by its Compose
      # service name rather than host loopback, and the database sits on the
      # volume rather than wherever a host-relative path would land.
      #
      # HOST and CLIENT_DIST are not here any more -- the image sets both.
      DB_PATH: /app/data/monitor.db
      # Set DOCKER_BROWSER_WS_ENDPOINT in .env to point at the chrome service
      # instead (http://chrome:9222) without touching this file.
      BROWSER_WS_ENDPOINT: ${DOCKER_BROWSER_WS_ENDPOINT:-ws://lightpanda:9222}
      # Empty means no login page at all, which is the right default while this
      # is published to loopback only.
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      # SQLite must survive `docker compose down` / image rebuilds -- same
      # data/ directory the host already gitignores.
      - ./data:/app/data
    ports:
      # Host side is configurable; the container side is fixed at 3000 because
      # that is what the image binds. Interpolating both would let them drift
      # apart the moment PORT is set in only one of the two places compose
      # reads.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    # The healthcheck moved into the Dockerfile, so `docker run` users get it too.

  # Default engine: tiny and fast, but Beta with partial Web API coverage and
  # no rendering at all (so no screenshots or PDF).
  lightpanda:
    image: lightpanda/browser:nightly
    container_name: lightpanda
    restart: unless-stopped
    # --host 0.0.0.0 binds inside the container. Binding 127.0.0.1 here would
    # bind the *container's* loopback and make the port unreachable from the
    # host even though the mapping below looks correct.
    #
    # The entrypoint is `tini --`, which execs argv[0] literally rather than
    # through a shell -- it must be the binary path, not just its subcommand.
    command: ["/usr/bin/lightpanda", "serve", "--host", "0.0.0.0", "--port", "9222"]
    ports:
      # Published only so a host-based `make start-server` can reach it. The app
      # container does not need this -- it reaches the browser by service name.
      - "127.0.0.1:9222:9222"

  # Fallback for sites Lightpanda can't render. Opt in explicitly:
  #   docker compose --profile chrome up -d
  # Local dev (`make start-server` on the host): point BROWSER_WS_ENDPOINT in .env at
  # http://127.0.0.1:9223 (http, not ws -- Chrome's socket URL carries a
  # per-launch UUID the server resolves via /json/version). Containerized app: set
  # DOCKER_BROWSER_WS_ENDPOINT=http://chrome:9222 in .env instead.
  chrome:
    image: chromedp/headless-shell:latest
    container_name: chrome-headless
    restart: unless-stopped
    profiles: ["chrome"]
    # Chrome crashes on the default 64MB /dev/shm under real page loads.
    shm_size: 1gb
    ports:
      - "127.0.0.1:9223:9222"
